<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #f3f0ea;
        color: #1a1814;
      }
      body {
        display: flex;
      }
      .bar {
        width: 18px;
        background: #1e3d34;
        flex: none;
      }
      .content {
        flex: 1;
        padding: 72px 84px 68px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 32px;
      }
      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-weight: 500;
        font-size: 72px;
        line-height: 1.05;
        letter-spacing: -0.025em;
        margin: 0;
        max-width: 15ch;
      }
      p {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        font-size: 28px;
        color: #4a453c;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="content">
      <div class="brand">Papa Bravo</div>
      <h1>Technology leadership that turns into delivery.</h1>
      <p>Pontus Burman · Stockholm</p>
    </div>
  </body>
</html>
